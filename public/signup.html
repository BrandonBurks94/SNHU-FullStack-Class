<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Sign Up - Travlr Getaways</title>
	<link rel="stylesheet" href="css/style.css" type="text/css">
</head>
<body>
	<div id="background">
		<div id="page">
			<div id="header">
				<div id="logo">
					<a href="index.html"><img src="images/logo.png" alt="Travlr Getaways" height="100" width="200"></a>
				</div>
				<div id="navigation">
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="/travel">Travel</a></li>
						<li><a href="news.html">News</a></li>
						<li><a href="reservations.html">Reservations</a></li>
						<li><a href="checkout.html">Checkout</a></li>
						<li class="selected"><a href="login.html">Login</a></li>
						<li><a href="http://127.0.0.1:4200">Admin</a></li>
					</ul>
				</div>
			</div>
			<div id="contents">
				<div class="box">
					<div>
						<div class="body">
							<h1>Customer Sign Up</h1>
							<div id="accountStatus" class="account-status"></div>
							<div id="signupMessage" class="travlr-message" aria-live="polite"></div>
							<form id="signupForm" class="travlr-form">
								<label for="name">Name</label>
								<input id="name" name="name" type="text" required>
								<label for="email">Email</label>
								<input id="email" name="email" type="email" required>
								<label for="password">Password</label>
								<input id="password" name="password" type="password" required>
								<label for="confirmPassword">Re-type Password</label>
								<input id="confirmPassword" name="confirmPassword" type="password" required>
								<label class="checkbox-label">
									<input name="terms" type="checkbox" required>
									I agree to the Terms of Use and Privacy Policy.
								</label>
								<input class="btn" type="submit" value="Sign Up">
							</form>
							<p>
								<a href="login.html">Already have an account?</a>
							</p>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id="footer">
			<div>
				<ul class="navigation">
					<li><a href="index.html">Home</a></li>
					<li><a href="/travel">Travel</a></li>
					<li><a href="news.html">News</a></li>
					<li><a href="reservations.html">Reservations</a></li>
					<li><a href="checkout.html">Checkout</a></li>
					<li class="active"><a href="login.html">Login</a></li>
					<li><a href="http://127.0.0.1:4200">Admin</a></li>
				</ul>
			</div>
			<p>&copy; 2026 by Travlr Getaways. All Rights Reserved</p>
		</div>
	</div>
	<script src="/js/travlr-public.js"></script>
</body>
</html>
