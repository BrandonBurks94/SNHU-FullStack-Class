<section class="mx-auto" style="max-width: 520px;">
  <h1 class="h3 mb-3">Admin Login</h1>

  <form class="bg-white border rounded-2 p-3 shadow-sm" (ngSubmit)="onLoginSubmit()">
    <div *ngIf="formError" class="alert alert-danger py-2">{{ formError }}</div>

    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input
        id="email"
        name="email"
        type="email"
        class="form-control"
        [(ngModel)]="credentials.email"
        required
        autocomplete="email">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        class="form-control"
        [(ngModel)]="credentials.password"
        required
        autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>
</section>
